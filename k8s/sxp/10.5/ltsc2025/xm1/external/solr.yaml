apiVersion: v1
kind: Service
metadata:
  name: solr
spec:
  selector:
    app: solr
  ports:
  - protocol: TCP
    port: 8983
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solr
  labels:
    app: solr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solr
  template:
    metadata:
      labels:
        app: solr
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: solr
        image: solr
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        ports:
        - containerPort: 8983
        env:
        - name: SOLR_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: sitecore-solr
              key: sitecore-solr-admin-username.txt
        - name: SOLR_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sitecore-solr
              key: sitecore-solr-admin-password.txt
        lifecycle:
          postStart:
            exec:
              command:
                - /bin/bash
                - -c
                - /bin/bash /opt/solr-config/ApplySolrSecurity.sh > /proc/1/fd/1 2>/proc/1/fd/2
        startupProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - |
              curl -sf -u "${SOLR_ADMIN_USERNAME}:${SOLR_ADMIN_PASSWORD}" "http://localhost:8983/solr/admin/info/system" >/dev/null
          timeoutSeconds: 30
          periodSeconds: 10
          failureThreshold: 18
        volumeMounts:
            - mountPath: /opt/solr-config
              name: solr-security-bootstrap
              readOnly: true
            - mountPath: /var/solr
              name: solr-data
            - mountPath: /tmp
              name: tmp
        resources:
          requests:
            memory: 2Gi
            cpu: 500m
          limits:
            memory: 3Gi
            cpu: 1500m
      volumes:
        - name: solr-security-bootstrap
          configMap:
            name: solr-security-bootstrap
        - emptyDir: {}
          name: solr-data
        - emptyDir: {}
          name: tmp
