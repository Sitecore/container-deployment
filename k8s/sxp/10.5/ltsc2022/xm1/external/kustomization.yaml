apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

images:
- name: mssql
  newName: mcr.microsoft.com/mssql/server
  newTag: 2025-RTM-ubuntu-22.04
- name: redis
  newName: redis
  newTag: 4.0.14-alpine
- name: solr
  newName: solr
  newTag: 10.0.0

resources:
  - mssql.yaml
  - redis.yaml
  - solr.yaml

configMapGenerator:
- name: solr-security-bootstrap
  options:
    disableNameSuffixHash: true
  files:
  - security.json=solr-security/security.json
  - ApplySolrSecurity.sh=solr-security/ApplySolrSecurity.sh