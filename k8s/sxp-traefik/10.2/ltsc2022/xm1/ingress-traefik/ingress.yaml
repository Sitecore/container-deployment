apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sitecore-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-sitecore-https-redirect@kubernetescrd,default-sitecore-buffering@kubernetescrd,default-sitecore-rewrite-root@kubernetescrd
spec:
  ingressClassName: "traefik"
  rules:
  - host: cd-placeholder-hostname
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cd
            port: 
              number: 80
  - host: cm-placeholder-hostname
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cm
            port: 
              number: 80
  - host: id-placeholder-hostname
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: id
            port: 
              number: 80
  tls:
  - secretName: global-cd-tls
    hosts:
    - cd-placeholder-hostname
  - secretName: global-cm-tls
    hosts:
    - cm-placeholder-hostname
  - secretName: global-id-tls
    hosts:
    - id-placeholder-hostname