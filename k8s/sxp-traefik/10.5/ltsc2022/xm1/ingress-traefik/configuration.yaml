apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sitecore-buffering
  namespace: default
spec:
  buffering:
    maxRequestBodyBytes: 536870912
    memRequestBodyBytes: 33554432
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sitecore-rewrite-root
  namespace: default
spec:
  replacePathRegex:
    regex: ^/$
    replacement: /
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sitecore-https-redirect
  namespace: default
spec:
  redirectScheme:
    scheme: https
    permanent: true